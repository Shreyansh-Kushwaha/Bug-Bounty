name: PR Security Scan

# Diff-aware BugHunter scan on pull requests. Opt-in: it no-ops unless a
# GEMINI_API_KEY repository secret is configured, so forks and key-less repos
# are unaffected. The scanned repo must be listed in config/targets.json.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target name from config/targets.json"
        required: true
      base:
        description: "Base ref"
        required: true
        default: "main"
      head:
        description: "Head ref"
        required: true
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for API key
        id: gate
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No GEMINI_API_KEY secret set - skipping scan."
          fi

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run diff scan
        if: steps.gate.outputs.enabled == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET: ${{ github.event.inputs.target }}
          BASE: ${{ github.event.inputs.base || github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.inputs.head || github.event.pull_request.head.ref }}
        run: |
          python -m scripts.pr_scan --target "$TARGET" --base "$BASE" --head "$HEAD" --out summary.md

      - name: Post PR comment
        if: steps.gate.outputs.enabled == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body-file summary.md

      - name: Job summary
        if: steps.gate.outputs.enabled == 'true'
        run: cat summary.md >> "$GITHUB_STEP_SUMMARY"
