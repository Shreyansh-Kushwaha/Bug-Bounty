name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          # Core + test deps only; LLM SDKs are imported lazily and not needed for tests.
          pip install pydantic python-dotenv rich pytest
      - name: Compile
        run: python -m py_compile src/*.py src/*/*.py
      - name: Test
        run: python -m pytest -q
