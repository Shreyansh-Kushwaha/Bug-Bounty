# Render Blueprint for the BugHunter API (backend only).
# The React frontend is deployed separately on Vercel (see frontend/vercel.json).
#
# NOTE: Render's managed runtime has no Docker daemon, so PoC validation and
# patch verification are skipped here — the pipeline still produces recon,
# analysis, patches, reports, and scores. The free plan also has an ephemeral
# filesystem (data/ is wiped on restart) and spins down when idle.
services:
  - type: web
    name: bughunter-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    # One worker only: run state is held in memory (see src/web/runner.py).
    startCommand: uvicorn src.web.app:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Operator login password for the web UI. Set in the Render dashboard.
      - key: LOGIN_PASSWORD
        sync: false
      # Stable signing secret so sessions survive restarts on ephemeral disk.
      - key: SESSION_SECRET
        generateValue: true
      # Cross-site cookie settings for a separate frontend origin (Vercel).
      - key: COOKIE_SECURE
        value: "1"
      - key: COOKIE_SAMESITE
        value: "none"
      # Your Vercel URL(s), comma-separated, e.g. https://bughunter.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      # At least one LLM provider key (Gemini free tier recommended).
      - key: GEMINI_API_KEY
        sync: false
